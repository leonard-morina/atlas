# Atlas — local infrastructure.
#
# Infrastructure only: database, log sink and message broker. The .NET services
# run on the host (dotnet run), not in here.
#
# Values come from the root .env via the root compose.yaml:
#
#   docker compose up -d          (from the repository root)
#
# Running from this folder also works; the ${VAR:-default} fallbacks below then
# apply, and they match the committed .env.

services:

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Local_Dev_Password_1}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # Current Seq versions refuse to start without an admin password or this opt-out.
      # Local development only: the provided setup documents Seq as having no credentials.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-atlas}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-atlas_local_dev}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Blob storage for identity documents and selfies (Azure Blob Storage in production).
  # --skipApiVersionCheck: current Azure SDKs ask for newer storage API versions than Azurite reports.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

  # Shared counters for rate limiting at the gateway, so the limit holds across gateway instances.
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sql-data:
  seq-data:
  rabbitmq-data:
  azurite-data:
